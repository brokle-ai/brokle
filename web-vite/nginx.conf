server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  brotli_static on;
  gzip_static on;

  # Security headers — separate file included so Phase 1.6 owns the
  # hash-based CSP story independently of this config.
  include /etc/nginx/conf.d/security-headers.inc;

  # Hashed immutable assets — year-long cache
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Runtime config — rendered by docker-entrypoint at boot, different per env
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Backend reverse proxy — same-origin posture mirrors Next.js rewrites.
  # In k8s this targets a Service named `backend`. Override via the
  # BROKLE_BACKEND_UPSTREAM env var at container boot if needed.
  location ~ ^/(api/v1|v1)/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — index.html MUST revalidate on every request so that
  # `/assets/` refs stay in sync with the currently-deployed build.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
