  # Projects Management — per-tier verb minting (Auth0 pattern).
  #
  # Same structural shape as `members:*` / `org_members:*`:
  #
  #   - `org_projects:*` (this block, scope: organization) decorates
  #     /api/v1/organizations/{orgId}/projects (LIST + CREATE) — the
  #     org-rooted project-management surface. Resolves against the
  #     user's org role only.
  #
  #   - `projects:*` (next block, scope: project) decorates
  #     /api/v1/projects/{projectId}/... (single GET, PUT, DELETE,
  #     archive, unarchive) — the project-resource surface. Project-
  #     tier so the project_members OVERRIDE applies (a restrictive
  #     project viewer override drops `projects:write|delete` from an
  #     org admin; an elevated project admin override grants them to
  #     an org viewer).
  #
  # `projects:read` is also the project-scope FLOOR — auto-injected by
  # role_service.autoInjectFloorScope when any project-tier permission
  # is granted (GitHub `metadata: read` model). See CLAUDE.md
  # 2026-04-30 (project-rbac).
  - name: "org_projects:list"
    description: "View the organization's project list"
    scope: organization
  - name: "org_projects:create"
    description: "Create new projects in the organization"
    scope: organization
  - name: "org_projects:admin"
    description: "Advanced organization-level project administration"
    scope: organization

  - name: "projects:read"
    description: "View project details (single-resource GET; floor scope)"
    scope: project
  - name: "projects:write"
    description: "Update project (PUT, archive, unarchive)"
    scope: project
  - name: "projects:delete"
    description: "Delete project"
    scope: project
  - name: "projects:admin"
    description: "Advanced project administration"
    scope: project

  # Project_members management is an ORG-rooted governance action and
  # decorates /api/v1/projects/{projectId}/members* with the existing
  # `org_members:*` family (above). Tagging the verbs project-tier
  # subjects them to the OVERRIDE-aware resolver, which produces a
  # lockout: a restrictive project_members override would strip the
  # caller's ability to UNDO it. Governance verbs stay org-tier so the
  # OVERRIDE only applies to project-scoped CONTENT verbs (traces:*,
  # dashboards:*, etc.). See CLAUDE.md 2026-04-30 (project-rbac).

