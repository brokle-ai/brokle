    scope: organization

  # Members Management — per-tier verb minting (Auth0 pattern).
  #
  # Membership is split into two distinct verb families that resolve at
  # different tiers:
  #
  #   - `org_members:*` (this section, scope: organization) decorates
  #     /api/v1/organizations/{orgId}/members* and /invitations* — the
  #     org-membership surface. Resolves against the user's org role
  #     only.
  #
  #   - `members:*` (further down, scope: project) decorates
  #     /api/v1/projects/{projectId}/members* — the project_members
  #     override surface. Project-tier so OVERRIDE semantics apply
  #     (project role REPLACES org role for project-scoped resolution).
  #
  # The earlier "shared-verb-family with sharedVerbResources exemption"
  # approach (round 8 / round 19) overloaded one tag onto two orthogonal
  # axes (resolver semantics + frontend context requirement) and broke
  # OVERRIDE on /api/v1/projects/{projectId}/members*. Per-tier minting
  # eliminates the trap structurally — Auth0 / GitHub OAuth / GCP IAM
  # pattern. See CLAUDE.md 2026-04-30 (project-rbac).
  - name: "org_members:read"
    description: "View organization members and pending invitations"
    scope: organization
  - name: "org_members:invite"
    description: "Invite new members to the organization"
    scope: organization
  - name: "org_members:update"
    description: "Update organization member roles"
    scope: organization
  - name: "org_members:remove"
    description: "Remove members from the organization"
    scope: organization

