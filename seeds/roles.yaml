  # Admin: full project lifecycle (incl. projects:delete) + everything
  # except organization-level deletion. Owner stays distinct at the ORG
  # level (organizations:delete) — NOT by withholding project deletion.
  # ProjectService.CreateProject writes a project_members admin grant
  # for every creator, so this template must carry the full project
  # lifecycle (read/write/admin/delete) to keep the GitHub/GitLab
  # "creator owns what they create" property end-to-end.
  - name: "admin"
    description: "Administrative access to organization resources (full project lifecycle)"
    scope_type: "organization"
    permissions:
      - "organizations:read"
      - "organizations:write"
      - "organizations:admin"
      - "org_members:read"
      - "org_members:invite"
      - "org_members:update"
