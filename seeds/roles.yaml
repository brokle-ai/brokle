      - "billing:read"
      - "billing:manage"
      - "billing:export"
      - "billing:admin"
      - "settings:read"
      - "settings:write"
      - "settings:export"
      - "settings:import"
      - "settings:security"
      - "settings:admin"
      - "roles:read"
      - "roles:write"
      - "roles:delete"
      - "roles:assign"
      - "permissions:read"
      - "org_projects:list"
      - "org_projects:create"
      - "projects:read"
      - "projects:write"
      - "projects:admin"
      - "projects:delete"
      - "api-keys:read"
